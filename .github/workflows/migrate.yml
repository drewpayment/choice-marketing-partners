name: Run Database Migrations

on:
  push:
    branches: [main]
    paths:
      - 'src/lib/database/migrations/**'

# One migration run against production at a time. cancel-in-progress MUST stay
# false: cancelling a job mid-DDL is worse than making the next one wait.
concurrency:
  group: db-migrate-prod
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: '1.2'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: bun run db:migrate
